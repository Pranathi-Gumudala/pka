name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile Spring Boot project and tests
        working-directory: pka
        run: ./mvnw -B -DskipTests package

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pka-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: pka-frontend
        run: npm ci
      - name: Build frontend
        working-directory: pka-frontend
        run: npm run build

  python-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements-dev.txt
      - name: Install agent dependencies
        working-directory: agent-service
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        working-directory: agent-service
        run: python -m compileall -q app tests
      - name: Run agent unit tests
        working-directory: agent-service
        run: python -m pytest -q
