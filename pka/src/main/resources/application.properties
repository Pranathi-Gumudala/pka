spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.application.name=pka

# Existing application database (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pka_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Chat model: Gemini by default; set AI_CHAT_PROVIDER=ollama for local chat.
app.ai.chat-provider=${AI_CHAT_PROVIDER:gemini}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}

# Ollama is retained for embeddings so the existing 768-dimensional vector index remains compatible.
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5-coder:7b}
app.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.ollama.embedding-dimensions=768

# Separate PostgreSQL database for RAG vectors.
app.vector-db.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/pka_vectors}
app.vector-db.username=${VECTOR_DB_USERNAME:pka_vector}
app.vector-db.password=${VECTOR_DB_PASSWORD}

# Retrieval and Python/LangGraph orchestration.
app.rag.retrieval-top-k=${RETRIEVAL_TOP_K:5}
app.agent.base-url=${PYTHON_AGENT_URL:http://127.0.0.1:8000}

# Upload limits.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:15MB}
