spring.application.name=pka

# Existing application database (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pka_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OpenAI API (keep OPENAI_API_KEY outside source control)
app.openai.api-key=${OPENAI_API_KEY}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.embedding-dimensions=1536

# Separate PostgreSQL database for RAG vectors
app.vector-db.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/pka_vectors}
app.vector-db.username=${VECTOR_DB_USERNAME:pka_vector}
app.vector-db.password=${VECTOR_DB_PASSWORD}
